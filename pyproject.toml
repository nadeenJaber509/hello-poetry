[project]
name = "hello-poetry"
version = "0.1.0"
description = ""
authors = [
    {name = "nadeenJaber509",email = "nadeen2017jaber@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit (>=1.65.0,<2.0.0)",
    "groq (>=1.7.0,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "sentence-transformers (>=6.2.0,<7.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "chromadb (>=1.5.9,<2.0.0)"
]

[tool.poetry]
packages = [{include = "hello_poetry", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.2,<0.18.0)"
]
[tool.ruff]
extend-exclude = ["DataExpoler"]
